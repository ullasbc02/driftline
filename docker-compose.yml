services:
  otel-collector:
    image: otel/opentelemetry-collector:0.96.0
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./collector/otel-collector.yaml:/etc/otel-collector.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
    networks:
      - driftline

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - driftline

  payment-api:
    build:
      context: ./demo/payment_api
    ports:
      - "8000:8000"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    depends_on:
      - otel-collector
    networks:
      - driftline

  driftline-ingest:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      - PYTHONPATH=/app
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - otel-collector
      - redis
    command: >
      sh -c "pip install fastapi uvicorn opentelemetry-proto protobuf googleapis-common-protos redis &&
             uvicorn ingest.main:app --host 0.0.0.0 --port 9000"
    ports:
      - "9000:9000"
    networks:
      - driftline

  profiler:
    image: python:3.11-slim
    working_dir: /app
    entrypoint: ["/bin/sh"]
    volumes:
      - ./profiler:/app/profiler
      - ./ingest:/app/ingest
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DRIFTLINE_STREAM_KEY=driftline:events
      - DRIFTLINE_PROFILE_PREFIX=driftline:profiles
      - PROFILE_WINDOW_SEC=60
      - PYTHONPATH=/app
    depends_on:
      - redis
    command: ["-c", "pip install redis && python profiler/consumer.py"]
    networks:
      - driftline

  graph-builder:
    image: python:3.11-slim
    working_dir: /app
    entrypoint: ["/bin/sh"]
    volumes:
      - ./graph:/app/graph
      - ./ingest:/app/ingest
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DRIFTLINE_STREAM_KEY=driftline:events
      - DRIFTLINE_GRAPH_PREFIX=driftline:graph
      - GRAPH_WINDOW_SEC=60
      - TRACE_TTL_SEC=120
      - PYTHONPATH=/app
    depends_on:
      - redis
    command: ["-c", "pip install redis && python graph/graph_builder_consumer.py"]
    networks:
      - driftline
  
  fraud-service:
    build:
      context: ./demo/fraud_service
    ports:
      - "8001:8001"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - ENV=local
      - ENABLE_SLOW_FRAUD=true
    depends_on:
      - otel-collector
    networks:
      - driftline

networks:
  driftline:
    driver: bridge

