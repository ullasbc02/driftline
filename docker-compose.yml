services:
  otel-collector:
    image: otel/opentelemetry-collector:0.96.0
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./collector/otel-collector.yaml:/etc/otel-collector.yaml
    ports:
      - "4317:4317"
      - "4318:4318"

  payment-api:
    build:
      context: ./demo/payment_api
    ports:
      - "8000:8000"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    depends_on:
      - otel-collector

  driftline-ingest:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./ingest:/app/ingest
    environment:
      - PYTHONPATH=/app
    depends_on:
      - otel-collector
    command: >
      sh -c "pip install fastapi uvicorn opentelemetry-proto protobuf googleapis-common-protos &&
             uvicorn ingest.main:app --host 0.0.0.0 --port 9000"
    ports:
      - "9000:9000"
